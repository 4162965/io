<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>搜图工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(-45deg, 
      #ff9a9e, #fad0c4, #fcb69f,
      #a1c4fd, #c2e9fb, #84fab0,
      #80d0c7, #a8edea, #f093fb, #f5576c
    );
    background-size: 600% 600%;
    animation: gradientBG 20s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    position: relative;
  }
  
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 75%; }
    50% { background-position: 100% 50%; }
    75% { background-position: 75% 25%; }
    100% { background-position: 0% 50%; }
  }
  
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(255, 255, 255, 0.8);
    z-index: -1;
  }

  .container {
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(25px);
    border-radius: 30px;
    padding: 35px 30px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.18);
    text-align: center;
    border: 1px solid rgba(255,255,255,0.9);
  }

  h2 {
    font-size: 32px;
    font-weight: 800;
    color: #000;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 14px;
    background: linear-gradient(90deg, #6c5ce7, #74b9ff, #00b894);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 28px;
    font-weight: 500;
  }

  .input-wrapper {
    position: relative;
    margin-bottom: 16px;
  }

  input[type="text"], select {
    width: 100%;
    padding: 18px 24px;
    font-size: 15px;
    border-radius: 30px;
