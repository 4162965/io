<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>全能搜图工具</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
  :root {
    --bg-gradient-1: #ff9a9e, #fad0c4, #fcb69f, #a1c4fd, #c2e9fb, #84fab0, #80d0c7, #a8edea, #f093fb, #f5576c;
    --body-bg: rgba(255,255,255,0.8);
    --container-bg: rgba(255,255,255,0.92);
    --text-color: #000;
    --sub-text: #6c757d;
    --border-color: rgba(0,0,0,0.08);
    --tag-bg: #f8f9fa;
  }

  [data-theme="dark"] {
    --body-bg: rgba(15,15,25,0.85);
    --container-bg: rgba(30,30,50,0.95);
    --text-color: #fff;
    --sub-text: #adb5bd;
    --border-color: rgba(255,255,255,0.1);
    --tag-bg: rgba(255,255,255,0.08);
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    transition: background 0.3s, color 0.3s;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(-45deg, var(--bg-gradient-1));
    background-size: 600% 600%;
    animation: gradientBG 20s ease infinite;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 15px;
    position: relative;
    color: var(--text-color);
  }
  
  @keyframes gradientBG {
    0% { background-position: 0% 50%; }
    25% { background-position: 25% 75%; }
    50% { background-position: 100% 50%; }
    75% { background-position: 75% 25%; }
    100% { background-position: 0% 50%; }
  }
  
  body::before {
    content: "";
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: var(--body-bg);
    z-index: -1;
  }

  .container {
    background: var(--container-bg);
    backdrop-filter: blur(25px);
    border-radius: 30px;
    padding: 35px 30px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 20px 80px rgba(0,0,0,0.18);
    text-align: center;
    border: 1px solid var(--border-color);
    position: relative;
  }

  .theme-switch {
    position: absolute;
    top: 20px;
    right: 20px;
    background: none;
    border: 1px solid var(--border-color);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    font-size: 16px;
  }

  h2 {
    font-size: 32px;
    font-weight: 800;
    color: var(--text-color);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }

  .subtitle {
    font-size: 14px;
    background: linear-gradient(90deg, #6c5ce7, #74b9ff, #00b894);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 15px;
    font-weight: 500;
  }

  .hot-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .hot-tag {
    padding: 4px 10px;
    border-radius: 12px;
    font-size: 12px;
    background: var(--tag-bg);
    border: 1px solid var(--border-color);
    cursor: pointer;
  }

  .input-wrapper {
    position: relative;
    margin-bottom: 16px;
  }

  input[type="text"] {
    width: 100%;
    padding: 18px 24px;
    font-size: 15px;
    border-radius: 30px;
    border: 1px solid var(--border-color);
    background: var(--tag-bg);
    color: var(--text-color);
    outline: none;
    transition: all 0.3s;
    box-shadow: 0 4px 20px rgba(0,0,0,0.06);
  }

  input:focus {
    border-color: transparent;
    box-shadow: 
      0 0 0 3px rgba(161,196,253,0.25),
      0 0 0 1px #a1c4fd;
  }

  #keyword {
    padding-right: 90px;
  }

  .btn-translate {
    position: absolute;
    right: 8px;
    top: 8px;
    bottom: 8px;
    background: linear-gradient(135deg, #84fab0, #8fd3f4, #a1c4fd);
    color: white;
    border: none;
    border-radius: 25px;
    padding: 0 15px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
    box-shadow: 0 2px 10px rgba(132, 250, 176, 0.3);
  }

  .btn-translate:hover {
    opacity: 0.95;
    transform: scale(0.96);
    box-shadow: 0 4px 15px rgba(132, 250, 176, 0.4);
  }

  .action-btn {
    width: 100%;
    padding: 16px 20px;
    font-size: 16px;
    font-weight: 600;
    border-radius: 30px;
    border: none;
    cursor: pointer;
    transition: all 0.25s;
    color: #000;
    box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    background: linear-gradient(135deg, #a1c4fd, #c2e9fb, #84fab0, #80d0c7);
    box-shadow: 0 4px 18px rgba(161,196,253,0.35);
    margin-bottom: 20px;
  }

  .action-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 25px rgba(0,0,0,0.15);
    filter: brightness(1.05);
  }

  /* 超级整齐排版：三列网格 + 圆圈强制左对齐 */
  .engine-group {
    background: var(--tag-bg);
    border-radius: 20px;
    padding: 18px 15px;
    margin-bottom: 22px;
    border: 1px solid var(--border-color);
  }
  .engine-list {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
  }
  .engine-item {
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 6px;
    padding: 9px 10px;
    border-radius: 12px;
    background: var(--tag-bg);
    border: 1px solid var(--border-color);
    font-size: 12px;
    cursor: pointer;
    transition: all 0.2s;
    text-align: left;
    white-space: nowrap;
  }
  .engine-item:hover {
    border-color: #a1c4fd;
    background: rgba(161,196,253,0.1);
  }
  .engine-item input {
    width: 14px;
    height: 14px;
    min-width: 14px;
    accent-color: #4ecdc4;
    margin: 0;
  }

  /* 需要VPN的网站标红 */
  .vpn-warning {
    color: #ff4757 !important;
    font-weight: 600;
  }

  .btn-row {
    display:flex;
    gap:10px;
    margin-bottom:15px;
  }
  .btn-text {
    flex:1;
    background: transparent;
    background: linear-gradient(90deg, #ff6b6b, #45b7d1);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    border: none;
    font-size: 13px;
    cursor: pointer;
    text-decoration: underline;
    font-weight: 500;
  }

  .btn-text:hover {
    background: linear-gradient(90deg, #e84393, #6c5ce7);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    text-decoration: none;
  }

  #result {
    width: 100%;
    background: var(--tag-bg);
    border: 1px solid var(--border-color);
    border-radius: 15px;
    padding: 12px 20px;
    text-align: center;
    font-size: 12px;
    color: var(--sub-text);
    margin-bottom: 25px;
  }

  .history-section {
    border-top: 1px solid var(--border-color);
    padding-top: 20px;
    text-align: left;
  }

  .history-title {
    display: flex;
    justify-content: space-between;
    font-size: 12px;
    background: linear-gradient(90deg, #74b9ff, #00b894);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    margin-bottom: 12px;
    font-weight: 500;
  }

  .clear-btn {
    background: none;
    border: none;
    background: linear-gradient(90deg, #ff7675, #fd79a8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    font-size: 12px;
    cursor: pointer;
  }

  .history-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .history-tag {
    background: var(--tag-bg);
    padding: 6px 12px;
    border-radius: 15px;
    font-size: 12px;
    color: var(--text-color);
    border: 1px solid var(--border-color);
    cursor: pointer;
  }

  .empty-history {
    font-size: 12px;
    color: var(--sub-text);
  }

  @media (max-width: 400px) {
    .container {
      padding: 25px 20px;
      border-radius: 25px;
    }
    h2 {
      font-size: 26px;
    }
    .action-btn {
      padding: 14px 16px;
      font-size: 15px;
    }
  }

  .loading {
    position: fixed;
    top:0;left:0;
    width:100%;height:100%;
    background:rgba(0,0,0,0.3);
    display:flex;
    justify-content:center;align-items:center;
    z-index:9999;
    color:#fff;
    font-size:20px;
  }
  .hide { display:none; }
</style>
</head>
<body>
<div class="loading hide" id="loading">加载中...</div>

<div class="container">
  <button class="theme-switch" id="themeBtn">🌓</button>
  <h2>全能搜图工具</h2>
  <div class="subtitle">一键多平台图片灵感搜索 | 免登录全站点</div>

  <!-- 植物快捷标签 -->
  <div class="hot-tags">
    <span class="hot-tag" onclick="fillKw('蝴蝶兰')">蝴蝶兰</span>
    <span class="hot-tag" onclick="fillKw('盆景')">盆景</span>
    <span class="hot-tag" onclick="fillKw('小植物')">小植物</span>
    <span class="hot-tag" onclick="fillKw('绿萝')">绿萝</span>
    <span class="hot-tag" onclick="fillKw('发财树')">发财树</span>
    <span class="hot-tag" onclick="fillKw('多肉')">多肉</span>
    <span class="hot-tag" onclick="fillKw('绿植')">绿植</span>
  </div>

  <div class="input-wrapper">
    <input type="text" id="keyword" placeholder="输入植物名称，例如：蝴蝶兰 / 盆景">
    <button class="btn-translate" onclick="translateKeyword()">中英互译</button>
  </div>

  <!-- 整齐网站选项 -->
  <div class="engine-group">
    <div class="engine-list" id="engineList"></div>
  </div>

  <button class="action-btn" onclick="search()">搜索</button>

  <div class="btn-row">
    <button class="btn-text" onclick="copyLink()">复制直达链接</button>
  </div>
  <input type="text" id="result" readonly placeholder="搜索链接将显示在这里">

  <div class="history-section">
    <div class="history-title">
      <span>搜索记录</span>
      <button class="clear-btn" onclick="clearHistory()">清空</button>
    </div>
    <div id="history-tags" class="history-tags"></div>
  </div>
</div>

<script>
// 严格按照你要求的顺序排列
const engines = {
  zhiwutuku: "植物图库",
  bing: "必应",
  baidu: "百度",
  sogou: "搜狗",
  huaban: "花瓣",
  so360: "360图片",
  quark: "夸克图片",
  zcool: "站酷",
  xiaohongshu: "小红书",
  google: "Google图片",
  pinterest: "Pinterest"
};
// 对应网址
const engineUrl = {
  zhiwutuku: "https://tu.lfhj.com.cn/index.php?mod=search#id=1&keyword=（关键词）",
  bing: "https://www.bing.com/images/search?q=（关键词）",
  baidu: "https://image.baidu.com/search/index?tn=baiduimage&word=（关键词）",
  sogou: "https://pic.sogou.com/pics?query=（关键词）",
  huaban: "https://huaban.com/search?q=（关键词）",
  so360: "https://image.so.com/i?q=（关键词）",
  quark: "https://m.quark.cn/vsearch/picture?qtab=picture&q=（关键词）",
  zcool: "https://www.zcool.com.cn/search/content?word=（关键词）",
  xiaohongshu: "https://www.xiaohongshu.com/search_result?keyword=（关键词）",
  google: "https://www.google.com/search?tbm=isch&q=（关键词）",
  pinterest: "https://www.pinterest.com/search/pins/?q=（关键词）"
};

// 主题
function initTheme(){
  let t = localStorage.getItem("theme") || "light";
  document.documentElement.setAttribute("data-theme",t);
}
document.getElementById("themeBtn").onclick = function(){
  let now = document.documentElement.getAttribute("data-theme");
  let next = now === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme",next);
  localStorage.setItem("theme",next);
}

// 快捷填充关键词
function fillKw(text){
  document.getElementById("keyword").value = text;
}

// 加载动画
function showLoading(){document.getElementById("loading").classList.remove("hide");}
function hideLoading(){document.getElementById("loading").classList.add("hide");}

// 单选保存
function saveChecked(val) {
  localStorage.setItem("s", val);
}
function getChecked() {
  return localStorage.getItem("s") || Object.keys(engines)[0];
}

// 渲染整齐的网站选项
function renderEngines(){
  let list = document.getElementById("engineList");
  list.innerHTML = "";
  let current = getChecked();
  
  Object.keys(engines).forEach(k => {
    let label = document.createElement("label");
    label.className = "engine-item";
    
    const vpnSites = ['google','pinterest'];
    const className = vpnSites.includes(k) ? 'vpn-warning' : '';
    
    label.innerHTML = `<input type="radio" name="engine" value="${k}"> <span class="${className}">${engines[k]}</span>`;
    let input = label.querySelector("input");
    input.checked = k === current;
    
    input.onchange = () => {
      saveChecked(k);
    };
    list.appendChild(label);
  })
}

// 中英互译
async function translateKeyword(){
  let v=document.getElementById("keyword").value.trim();
  if(!v){alert("请输入内容");return}
  let b=document.querySelector(".btn-translate");
  let t=b.innerText;
  b.innerText="翻译中…";b.disabled=1;
  
  try {
    const isChinese = /[\u4e00-\u9fa5]/i.test(v);
    const langPair = isChinese ? "zh|en" : "en|zh";
    
    let res = await fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(v)}&langpair=${langPair}`);
    let data = await res.json();
    if(data?.responseData?.translatedText){
      document.getElementById("keyword").value = data.responseData.translatedText;
    }
  } catch(e){
    alert("翻译服务暂时不可用");
  }
  
  b.innerText=t;b.disabled=0;
}

// 历史记录
function getHistory(){let h=localStorage.getItem("h");return h?JSON.parse(h):[]}
function saveHistory(k){
  if(!k)return;
  let a=getHistory();
  a=a.filter(i=>i!==k);
  a.unshift(k);
  if(a.length>10)a.pop();
  localStorage.setItem("h",JSON.stringify(a));
  renderHistory();
}
function renderHistory(){
  let a=getHistory();
  let b=document.getElementById("history-tags");
  b.innerHTML="";
  if(a.length===0){
    b.innerHTML='<span class="empty-history">暂无记录</span>';
    return;
  }
  a.forEach(k=>{
    let s=document.createElement("span");
    s.className="history-tag";
    s.innerText=k;
    s.onclick=()=>{document.getElementById("keyword").value=k};
    b.appendChild(s);
  })
}
function clearHistory(){localStorage.removeItem("h");renderHistory()}

function buildUrl(k){
  let w=document.getElementById("keyword").value.trim();
  return w?engineUrl[k].replace("（关键词）",encodeURIComponent(w)):"";
}

// 单选搜索
function search(){
  let w=document.getElementById("keyword").value.trim();
  if(!w){alert("请输入关键词");return}
  
  let selected = getChecked();
  if(!selected){alert("请选择网站");return}
  
  saveHistory(w);
  let u = buildUrl(selected);
  if(u) window.open(u, '_blank');
}

function copyLink(){
  let selected = getChecked();
  if(!selected){alert("请选择网站");return}
  
  let url = buildUrl(selected);
  if(url){
    document.getElementById("result").value = url;
    navigator.clipboard.writeText(url).then(()=>alert("已复制链接")).catch(()=>alert("复制失败"));
  }
}

window.onload=()=>{
  initTheme();
  renderHistory();
  renderEngines();
  const kw = document.getElementById("keyword");
  kw.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      e.preventDefault();
      search();
    }
  });
  kw.focus();
  setTimeout(hideLoading,300);
}
</script>
</body>
</html>
